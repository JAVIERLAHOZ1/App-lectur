name: Construir APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: APK de depuracion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Compilar
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar el APK
        run: cp app/build/outputs/apk/debug/app-debug.apk lectur.apk

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: lectur-debug-apk
          path: lectur.apk
          if-no-files-found: error

      # Deja el APK descargable con un enlace directo, sin iniciar sesion.
      - name: Publicar la ultima version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-version
          name: Lectur - ultima version
          body: |
            APK de Lectur listo para instalar en la tablet.

            Descarga **lectur.apk** de aqui abajo, abrelo en la tablet y acepta
            "Instalar aplicaciones desconocidas" cuando Android lo pida.

            Compilado desde el commit ${{ github.sha }}.
          files: lectur.apk
          make_latest: true
