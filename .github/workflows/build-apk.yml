name: Construir APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: APK de depuracion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      # El diccionario offline se genera del volcado del Wikcionario. Tarda un
      # buen rato, asi que se guarda en cache y solo se rehace si cambia el
      # generador (o si se sube el numero de version de la clave).
      - name: Cache del diccionario
        id: cache-diccionario
        uses: actions/cache@v4
        with:
          path: diccionario.db
          key: diccionario-v1-${{ hashFiles('tools/build_dictionary.py') }}

      - name: Comprobar el generador del diccionario
        run: python3 tools/build_dictionary.py --autotest

      - name: Generar el diccionario
        if: steps.cache-diccionario.outputs.cache-hit != 'true'
        run: python3 tools/build_dictionary.py --salida diccionario.db

      - name: Incluir el diccionario en la app
        run: |
          mkdir -p app/src/main/assets
          cp diccionario.db app/src/main/assets/diccionario.db
          ls -lh app/src/main/assets/diccionario.db

      - name: Compilar
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar el APK
        run: cp app/build/outputs/apk/debug/app-debug.apk lectur.apk

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: lectur-debug-apk
          path: lectur.apk
          if-no-files-found: error

      # Deja el APK descargable con un enlace directo, sin iniciar sesion.
      - name: Publicar la ultima version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-version
          name: Lectur - ultima version
          body: |
            APK de Lectur listo para instalar en la tablet.

            Descarga **lectur.apk** de aqui abajo, abrelo en la tablet y acepta
            "Instalar aplicaciones desconocidas" cuando Android lo pida.

            Compilado desde el commit ${{ github.sha }}.
          files: lectur.apk
          make_latest: true
